name: demographic-resolution-v2 tests

on:
  push:
    branches:
      - method/demographic-resolution-v2
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile Python sources
        run: python -m compileall -q app.py app_v2_2.py kratos_core.py scripts tests
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q
      - name: Bundle open-source runtime dependencies for local validation
        run: |
          mkdir -p dependency_bundle
          python -m pip install --no-deps --target dependency_bundle country-converter
          python -m pip install --no-deps --target dependency_bundle 'genderComputer @ git+https://github.com/tue-mdse/genderComputer.git@f6267615517913e53cb0b882b248f1c2e11b8bbc'
          python -m pip install --no-deps --target dependency_bundle python-nameparser Unidecode
      - name: Upload dependency bundle
        uses: actions/upload-artifact@v4
        with:
          name: kratos-open-source-dependencies
          path: dependency_bundle
          if-no-files-found: error
          retention-days: 1
